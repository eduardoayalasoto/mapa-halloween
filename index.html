<body>
  <div class="marco">
    <header class="encabezado">
      <div class="titulo">
        <h1>¡Halloween<br>en La Alteña!</h1>
        <p class="subtitulo">¿Dónde daremos dulces el 31 de octubre?</p>
      </div>
      <svg class="luna" viewBox="0 0 120 120" role="img" aria-label="Luna llena con murciélagos">
        <circle cx="60" cy="62" r="36" fill="#FFDDA6"/>
        <g fill="#1E1838">
          <path transform="translate(60 52) scale(1.15)" d="M0,-4 C-3,-8 -9,-8 -12,-3 C-14,-6 -18,-6 -20,-3 C-17,0 -14,2 -12,8 C-8,4 -4,4 0,6 C4,4 8,4 12,8 C14,2 17,0 20,-3 C18,-6 14,-6 12,-3 C9,-8 3,-8 0,-4 Z"/>
          <path transform="translate(92 22) scale(.45)" d="M0,-4 C-3,-8 -9,-8 -12,-3 C-14,-6 -18,-6 -20,-3 C-17,0 -14,2 -12,8 C-8,4 -4,4 0,6 C4,4 8,4 12,8 C14,2 17,0 20,-3 C18,-6 14,-6 12,-3 C9,-8 3,-8 0,-4 Z"/>

    <main class="contenido">
      <section class="mapa-wrap" aria-label="Mapa de casas">
        <div id="mapa" class="mapa"></div>
      </section>

      <section class="lista-wrap" aria-labelledby="contador">
        <h2 id="contador" class="contador">🎃 Cargando casas…</h2>
        <button id="ver-todas" class="ver-todas" type="button">📍 Ver todas las casas en el mapa</button>
        <div id="lista" class="lista"></div>
      </section>
    </main>
  </div>

  <noscript>Necesitas JavaScript para ver el mapa y la lista de casas.</noscript>
  <script type="module" src="js/app.js"></script>
